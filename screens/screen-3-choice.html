<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 · Customer chooses · Delay Radar Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #EFEDE9; }
  body { display: flex; justify-content: center; padding: 24px 12px; font-family: 'Manrope', system-ui, sans-serif; }
  .screen { width: 390px; max-width: 100%; height: 844px; background: #FAF9F7; display: flex; flex-direction: column; color: #14131A; overflow: hidden; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); }
  .appbar { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #FFFFFF; border-bottom: 1px solid #ECEAE6; }
  .appbar h1 { font-size: 15.5px; font-weight: 800; margin: 0; }
  .iconbtn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: #14131A; text-decoration: none; flex: none; }
  .content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .intro { font-size: 13.5px; color: #4A4953; line-height: 1.5; margin-bottom: 2px; }
  .option { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px; border: 1.5px solid #ECEAE6; background: #FFFFFF; cursor: pointer; }
  .option.selected { border-color: #FF3B6E; background: #FFF5F8; }
  .option input[type="radio"] { width: 20px; height: 20px; accent-color: #FF3B6E; margin: 1px 0 0; flex: none; }
  .opt-title { font-weight: 800; font-size: 13.5px; }
  .opt-sub { color: #8B8996; font-size: 12px; margin-top: 3px; line-height: 1.4; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #E3F6EC; color: #0F7A4E; margin-top: 6px; }
  .bottombar { flex: none; padding: 14px 16px; border-top: 1px solid #ECEAE6; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px; }
  .btn-primary { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #FF3B6E; color: #fff; font-weight: 800; font-size: 14px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
  .btn-ghost { text-align: center; color: #6B6976; font-size: 12.5px; font-weight: 700; text-decoration: underline; }
  .protonav { width: 390px; max-width:100%; margin: 0 auto 14px; text-align:center; font-family:'Manrope',sans-serif; }
  .protonav a { font-size: 12.5px; font-weight: 700; color: #6B6976; text-decoration: none; }
  .protonav a:hover { text-decoration: underline; }
  .wrap-outer{ display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<div class="wrap-outer">
<div class="protonav"><a href="../index.html">&larr; Back to case study</a> &middot; Screen 3 of 5 &middot; Customer chooses</div>
<div class="screen">
  <div class="appbar">
    <a class="iconbtn" href="screen-2-tracking.html" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1>Make it right</h1>
  </div>
  <div class="content">
    <div class="intro">Your order's running late &mdash; pick whatever works best for you.</div>

    <label class="option selected" id="opt-wait">
      <input type="radio" name="resolution" value="wait" checked>
      <div style="flex:1;">
        <div class="opt-title">Wait, with &#8377;150 credit</div>
        <div class="opt-sub">Already added to your wallet &middot; arrives by 19 Sept</div>
        <span class="pill">Applied</span>
      </div>
    </label>

    <label class="option" id="opt-ship">
      <input type="radio" name="resolution" value="ship">
      <div style="flex:1;">
        <div class="opt-title">Free express re-ship</div>
        <div class="opt-sub">A backup unit ships today from our Bengaluru warehouse</div>
        <span class="pill">Arrives in 2 days</span>
      </div>
    </label>

    <label class="option" id="opt-refund">
      <input type="radio" name="resolution" value="refund">
      <div style="flex:1;">
        <div class="opt-title">Instant refund</div>
        <div class="opt-sub">Full refund to your original payment method &middot; 3&ndash;5 business days</div>
      </div>
    </label>
  </div>
  <div class="bottombar">
    <a class="btn-primary" href="screen-5-confirmation.html" id="confirmBtn">Confirm choice</a>
    <a class="btn-ghost" href="screen-4-support.html">Need to talk to someone?</a>
  </div>
</div>
</div>
<script>
(function(){
  try {
    var labels = document.querySelectorAll('.option');
    labels.forEach(function(label){
      var input = label.querySelector('input[type="radio"]');
      input.addEventListener('change', function(){
        labels.forEach(function(l){ l.classList.remove('selected'); });
        label.classList.add('selected');
      });
    });
  } catch(e) { /* selection styling is a convenience only */ }
})();
</script>
</body>
</html>
